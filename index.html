<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林柏翰 BMI 健康計算器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 背景微漸變動畫 */
        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef3c7 100%);
            min-height: 100vh;
        }

        /* 儀表針/指示條動態過渡 */
        .gauge-pointer {
            transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 卡片玻璃擬態效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen text-slate-800">

    <!-- 頁首與導覽區 -->
    <header class="w-full py-6 px-4 text-center">
        <div class="inline-flex items-center space-x-3 bg-white/60 backdrop-blur-md px-6 py-2.5 rounded-full shadow-sm border border-white">
            <div class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center text-xl shadow-md">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-800 tracking-wide">
                林柏翰 <span class="text-emerald-600">BMI</span> 健康計算器
            </h1>
        </div>
    </header>

    <!-- 主要內容區域 -->
    <main class="flex-grow flex items-center justify-center px-4 py-4">
        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-6">

            <!-- 左側：輸入表單區塊 -->
            <div class="md:col-span-5 glass-card rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex items-center space-x-2 border-b border-slate-200/80 pb-4 mb-6">
                        <i class="fa-solid fa-sliders text-emerald-500 text-lg"></i>
                        <h2 class="text-lg font-bold text-slate-700">身體數據輸入</h2>
                    </div>

                    <form id="bmi-form" onsubmit="return false;" class="space-y-5">
                        <!-- 性別選擇 -->
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-2">性別（可選）</label>
                            <div class="grid grid-cols-2 gap-3">
                                <button type="button" id="btn-male" onclick="setGender('male')" class="gender-btn py-2.5 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-center space-x-2 transition hover:border-emerald-400">
                                    <i class="fa-solid fa-mars text-sky-500"></i>
                                    <span>男性</span>
                                </button>
                                <button type="button" id="btn-female" onclick="setGender('female')" class="gender-btn py-2.5 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-center space-x-2 transition hover:border-emerald-400">
                                    <i class="fa-solid fa-venus text-rose-500"></i>
                                    <span>女性</span>
                                </button>
                            </div>
                        </div>

                        <!-- 年齡 -->
                        <div>
                            <label for="age" class="block text-xs font-bold text-slate-500 mb-1">年齡（歲，可選）</label>
                            <div class="relative">
                                <input type="number" id="age" min="1" max="120" placeholder="例如：25" class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition bg-white/70">
                                <span class="absolute right-4 top-3.5 text-xs text-slate-400 font-bold">歲</span>
                            </div>
                        </div>

                        <!-- 身高 -->
                        <div>
                            <label for="height" class="block text-xs font-bold text-slate-500 mb-1">身高（cm）<span class="text-rose-500">*</span></label>
                            <div class="relative">
                                <input type="number" id="height" min="50" max="250" step="0.1" placeholder="例如：175" required class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition bg-white/70 font-bold text-slate-700">
                                <span class="absolute right-4 top-3.5 text-xs text-slate-400 font-bold">cm</span>
                            </div>
                        </div>

                        <!-- 體重 -->
                        <div>
                            <label for="weight" class="block text-xs font-bold text-slate-500 mb-1">體重（kg）<span class="text-rose-500">*</span></label>
                            <div class="relative">
                                <input type="number" id="weight" min="20" max="300" step="0.1" placeholder="例如：68" required class="w-full pl-4 pr-12 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-transparent transition bg-white/70 font-bold text-slate-700">
                                <span class="absolute right-4 top-3.5 text-xs text-slate-400 font-bold">kg</span>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- 按鈕組 -->
                <div class="mt-6 space-y-2">
                    <button type="button" onclick="calculateBMI()" class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-lg rounded-xl shadow-lg shadow-emerald-500/20 transition transform active:scale-95 flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-calculator"></i>
                        <span>計算 BMI</span>
                    </button>
                    <button type="button" onclick="resetForm()" class="w-full py-2 text-xs font-bold text-slate-400 hover:text-slate-600 transition">
                        重設欄位
                    </button>
                </div>
            </div>

            <!-- 右側：計算結果與評估區塊 -->
            <div class="md:col-span-7 glass-card rounded-3xl p-6 sm:p-8 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between border-b border-slate-200/80 pb-4 mb-6">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-chart-pie text-emerald-500 text-lg"></i>
                            <h2 class="text-lg font-bold text-slate-700">健康分析結果</h2>
                        </div>
                        <span id="category-badge" class="px-3 py-1 rounded-full text-xs font-black bg-slate-100 text-slate-500 border border-slate-200 transition-all">
                            請輸入數據
                        </span>
                    </div>

                    <!-- BMI 數值顯示 -->
                    <div class="text-center py-4 bg-white/60 rounded-2xl border border-white mb-6 shadow-inner">
                        <span class="text-xs font-bold text-slate-400 block mb-1">您的 BMI 數值</span>
                        <div id="bmi-value" class="text-5xl sm:text-6xl font-black text-slate-300 transition-all">
                            --.-
                        </div>
                    </div>

                    <!-- BMI 色彩視覺條 (Gauge Bar) -->
                    <div class="mb-6">
                        <div class="flex justify-between text-[11px] font-bold text-slate-400 mb-1.5 px-1">
                            <span>過輕</span>
                            <span>正常</span>
                            <span>過重</span>
                            <span>肥胖</span>
                        </div>
                        <!-- 色彩條 -->
                        <div class="relative w-full h-4 rounded-full overflow-hidden flex shadow-inner">
                            <div class="w-[18.5%] bg-sky-400" title="過輕 (<18.5)"></div>
                            <div class="w-[24%] bg-emerald-400" title="正常 (18.5-23.9)"></div>
                            <div class="w-[12.5%] bg-amber-400" title="過重 (24.0-26.9)"></div>
                            <div class="w-[45%] bg-rose-500" title="肥胖 (≥27.0)"></div>

                            <!-- 動態游標指示器 -->
                            <div id="gauge-pointer" class="gauge-pointer absolute top-0 bottom-0 w-2 bg-slate-900 rounded-full shadow-md border border-white" style="left: 0%; opacity: 0;"></div>
                        </div>
                    </div>

                    <!-- 理想體重建議卡片 -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white/60 p-3.5 rounded-2xl border border-white">
                            <span class="text-[11px] font-bold text-slate-400 block">理想體重範圍</span>
                            <span id="ideal-weight" class="text-base font-black text-slate-700">-- kg</span>
                        </div>
                        <div class="bg-white/60 p-3.5 rounded-2xl border border-white">
                            <span class="text-[11px] font-bold text-slate-400 block">標準 BMI 範圍</span>
                            <span class="text-base font-black text-slate-700">18.5 - 23.9</span>
                        </div>
                    </div>

                    <!-- 健康建議 -->
                    <div class="bg-emerald-50/70 border border-emerald-100 rounded-2xl p-4">
                        <div class="flex items-center space-x-2 mb-1 text-emerald-800 font-bold text-xs">
                            <i class="fa-solid fa-lightbulb"></i>
                            <span>柏翰的健康提醒</span>
                        </div>
                        <p id="health-advice" class="text-xs text-slate-600 leading-relaxed">
                            請在左側輸入您的身高與體重，系統將即時為您分析您的健康指數與專屬建議。
                        </p>
                    </div>
                </div>

                <!-- 衛福部標準參考表格折疊 -->
                <div class="mt-6 pt-4 border-t border-slate-200/80">
                    <details class="group cursor-pointer">
                        <summary class="flex justify-between items-center text-xs font-bold text-slate-400 hover:text-slate-600">
                            <span>檢視衛福部 BMI 分級標準</span>
                            <i class="fa-solid fa-chevron-down group-open:rotate-180 transition-transform"></i>
                        </summary>
                        <div class="mt-3 text-[11px] grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2">
                            <div class="p-2 rounded bg-sky-50 text-sky-700"><b>過輕：</b> BMI &lt; 18.5</div>
                            <div class="p-2 rounded bg-emerald-50 text-emerald-700"><b>正常：</b> 18.5 ≤ BMI &lt; 24</div>
                            <div class="p-2 rounded bg-amber-50 text-amber-700"><b>過重：</b> 24 ≤ BMI &lt; 27</div>
                            <div class="p-2 rounded bg-rose-50 text-rose-600"><b>輕度肥胖：</b> 27 ≤ BMI &lt; 30</div>
                            <div class="p-2 rounded bg-rose-100 text-rose-700"><b>中度肥胖：</b> 30 ≤ BMI &lt; 35</div>
                            <div class="p-2 rounded bg-rose-200 text-rose-900"><b>重度肥胖：</b> BMI ≥ 35</div>
                        </div>
                    </details>
                </div>
            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="w-full py-4 text-center text-xs font-bold text-slate-400">
        © 林柏翰健康工坊 • 守護您的健康生活
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        let selectedGender = null;

        // 即時監聽輸入欄位變化
        document.addEventListener('DOMContentLoaded', () => {
            const heightInput = document.getElementById('height');
            const weightInput = document.getElementById('weight');

            heightInput.addEventListener('input', calculateBMI);
            weightInput.addEventListener('input', calculateBMI);
        });

        // 性別切換
        function setGender(gender) {
            selectedGender = gender;
            const maleBtn = document.getElementById('btn-male');
            const femaleBtn = document.getElementById('btn-female');

            if (gender === 'male') {
                maleBtn.className = 'gender-btn py-2.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-bold flex items-center justify-center space-x-2 transition shadow-sm';
                femaleBtn.className = 'gender-btn py-2.5 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-center space-x-2 transition hover:border-emerald-400';
            } else {
                femaleBtn.className = 'gender-btn py-2.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-bold flex items-center justify-center space-x-2 transition shadow-sm';
                maleBtn.className = 'gender-btn py-2.5 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-center space-x-2 transition hover:border-emerald-400';
            }
            calculateBMI();
        }

        // BMI 計算主邏輯
        function calculateBMI() {
            const heightCm = parseFloat(document.getElementById('height').value);
            const weightKg = parseFloat(document.getElementById('weight').value);

            // 數值驗證
            if (!heightCm || !weightKg || heightCm <= 0 || weightKg <= 0) {
                resetResultDisplay();
                return;
            }

            // BMI 計算公式: kg / (m^2)
            const heightM = heightCm / 100;
            const bmi = weightKg / (heightM * heightM);
            const bmiFixed = bmi.toFixed(1);

            // 計算理想體重範圍 (BMI 18.5 ~ 23.9)
            const minIdealWeight = (18.5 * heightM * heightM).toFixed(1);
            const maxIdealWeight = (23.9 * heightM * heightM).toFixed(1);

            // 分級評估與樣式對應
            const evaluation = getBMIEvaluation(bmi);

            // 更新 UI
            const bmiValueEl = document.getElementById('bmi-value');
            bmiValueEl.innerText = bmiFixed;
            bmiValueEl.className = `text-5xl sm:text-6xl font-black transition-all ${evaluation.textColor}`;

            const badgeEl = document.getElementById('category-badge');
            badgeEl.innerText = evaluation.label;
            badgeEl.className = `px-3 py-1 rounded-full text-xs font-black shadow-sm transition-all ${evaluation.badgeStyle}`;

            document.getElementById('ideal-weight').innerText = `${minIdealWeight} - ${maxIdealWeight} kg`;
            document.getElementById('health-advice').innerText = evaluation.advice;

            // 移動動態儀表游標 (將 BMI 數值映照到 0% ~ 100% 寬度)
            updateGaugePointer(bmi);
        }

        // BMI 衛福部分級判斷
        function getBMIEvaluation(bmi) {
            if (bmi < 18.5) {
                return {
                    label: '體重過輕',
                    textColor: 'text-sky-500',
                    badgeStyle: 'bg-sky-100 text-sky-700 border border-sky-300',
                    advice: '您的體重偏輕，建議適度增加營養攝取並搭配阻力運動，提升肌肉量與免疫力。'
                };
            } else if (bmi >= 18.5 && bmi < 24) {
                return {
                    label: '健康正常',
                    textColor: 'text-emerald-500',
                    badgeStyle: 'bg-emerald-100 text-emerald-700 border border-emerald-300',
                    advice: '太棒了！您的 BMI 處於極佳的健康標準範圍，請繼續保持均衡飲食與規律運動！'
                };
            } else if (bmi >= 24 && bmi < 27) {
                return {
                    label: '體重過重',
                    textColor: 'text-amber-500',
                    badgeStyle: 'bg-amber-100 text-amber-700 border border-amber-300',
                    advice: '您的體重稍微偏重囉！建議控制含糖飲料與高油飲食，並增加每週有氧運動時間。'
                };
            } else if (bmi >= 27 && bmi < 30) {
                return {
                    label: '輕度肥胖',
                    textColor: 'text-rose-500',
                    badgeStyle: 'bg-rose-100 text-rose-700 border border-rose-300',
                    advice: '處於輕度肥胖範圍，建議開始規劃減脂飲食與規律運動，預防慢性疾病發生。'
                };
            } else if (bmi >= 30 && bmi < 35) {
                return {
                    label: '中度肥胖',
                    textColor: 'text-rose-600',
                    badgeStyle: 'bg-rose-200 text-rose-800 border border-rose-400',
                    advice: '您的體重已達中度肥胖，建議諮詢醫師或營養師，尋求專業的健康減重指引。'
                };
            } else {
                return {
                    label: '重度肥胖',
                    textColor: 'text-rose-700',
                    badgeStyle: 'bg-rose-300 text-rose-900 border border-rose-500',
                    advice: '重度肥胖會顯著增加心血管疾病風險，強烈建議積極就醫尋求醫療團隊的減重協助。'
                };
            }
        }

        // 色彩條指示器位置設定
        function updateGaugePointer(bmi) {
            const pointer = document.getElementById('gauge-pointer');
            pointer.style.opacity = '1';

            // 將 10 ~ 40 的 BMI 映射至 0% ~ 100%
            const minBmi = 10;
            const maxBmi = 40;
            let percentage = ((bmi - minBmi) / (maxBmi - minBmi)) * 100;
            
            // 限制在邊界範圍內
            if (percentage < 2) percentage = 2;
            if (percentage > 98) percentage = 98;

            pointer.style.left = `calc(${percentage}% - 4px)`;
        }

        // 清空結果
        function resetResultDisplay() {
            const bmiValueEl = document.getElementById('bmi-value');
            bmiValueEl.innerText = '--.-';
            bmiValueEl.className = 'text-5xl sm:text-6xl font-black text-slate-300 transition-all';

            const badgeEl = document.getElementById('category-badge');
            badgeEl.innerText = '請輸入數據';
            badgeEl.className = 'px-3 py-1 rounded-full text-xs font-black bg-slate-100 text-slate-500 border border-slate-200 transition-all';

            document.getElementById('ideal-weight').innerText = '-- kg';
            document.getElementById('health-advice').innerText = '請在左側輸入您的身高與體重，系統將即時為您分析您的健康指數與專屬建議。';

            const pointer = document.getElementById('gauge-pointer');
            pointer.style.opacity = '0';
            pointer.style.left = '0%';
        }

        // 重設輸入表單
        function resetForm() {
            document.getElementById('bmi-form').reset();
            selectedGender = null;
            document.getElementById('btn-male').className = 'gender-btn py-2.5 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-center space-x-2 transition hover:border-emerald-400';
            document.getElementById('btn-female').className = 'gender-btn py-2.5 rounded-xl border-2 border-slate-200 bg-white text-slate-600 font-bold flex items-center justify-center space-x-2 transition hover:border-emerald-400';
            resetResultDisplay();
        }
    </script>
</body>
</html>
